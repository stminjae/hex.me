<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700&family=Instrument+Serif:ital@1&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --obsidian: #14141c;
    --pink: #f5c0c0;
    --opal: #fdf0f0;
    --rose: #d9a3ab;
    --sans: Cinetype, "Instrument Sans", system-ui, sans-serif;
    --serif: "Instrument Serif", Georgia, serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--obsidian); color: var(--pink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }

  .hero { position: relative; min-height: 100vh; min-height: 100svh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 96px 16px 180px; overflow: hidden; }
  .dither { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; pointer-events: none; }
  .hero::before { content: ""; position: absolute; inset: 0; background: linear-gradient(to right, var(--obsidian), transparent 15% 85%, var(--obsidian)); pointer-events: none; z-index: 1; }

  .content { position: relative; z-index: 2; width: 100%; max-width: 1000px; display: flex; flex-direction: column; align-items: center; gap: clamp(24px, 16px + 2vw, 32px); }
  .eyebrow { margin: 0; font-family: var(--mono); font-size: 14px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; line-height: 1; }
  .eyebrow a { color: inherit; text-decoration: none; border-bottom: 1px solid currentColor; }
  h1 { width: 100%; margin: 0; display: flex; flex-direction: column; gap: clamp(16px, 10px + 1.5vw, 24px); }
  .title { display: block; color: var(--opal); font-family: var(--serif); font-style: italic; font-size: clamp(30px, 4.2vw, 56px); text-wrap: balance; font-weight: 400; letter-spacing: -.01em; line-height: 1.08; }
  @media (max-width: 700px) { .wide-br { display: none; } }

  .menu { position: relative; width: min(100%, 520px); margin-top: 8px; background: var(--obsidian); border: 1px dashed color-mix(in srgb, var(--pink) 65%, transparent); border-radius: 16px; text-align: left; overflow: hidden; }
  .menu-label { margin: 0; padding: 18px 24px 16px; color: var(--pink); font-size: clamp(17px, 1.6vw, 20px); font-weight: 600; line-height: 1.3; border-bottom: 1px dashed color-mix(in srgb, var(--pink) 40%, transparent); }
  .menu ul { list-style: none; margin: 0; padding: 0; }
  .menu li + li { border-top: 1px dashed color-mix(in srgb, var(--pink) 40%, transparent); }
  .menu a { display: flex; align-items: baseline; gap: 16px; padding: 18px 24px; color: var(--opal); font-size: clamp(17px, 1.6vw, 20px); font-weight: 600; text-decoration: none; transition: background-color .2s; }
  .menu a .num { font-family: var(--mono); font-size: 13px; font-weight: 500; letter-spacing: .12em; color: var(--pink); }
  .menu a[href]:hover, .menu a[href]:focus-visible { background: color-mix(in srgb, var(--pink) 18%, transparent); outline: none; }
  .menu a[aria-disabled] { cursor: default; }
</style>

<body>
<main class="hero">
  <canvas class="dither" aria-hidden="true"></canvas>
  <header class="content">
    <p class="eyebrow">Created by <a href="https://www.linkedin.com/in/minjae-lee/">Minjae Lee</a></p>
    <h1>
      <span class="title">Commercial Mid&#8209;Market<br class="wide-br"> Sales Engineer Candidate</span>
    </h1>
    <nav class="menu" aria-label="Explore">
      <p class="menu-label">Explore your adventure below</p>
      <ul>
        <li><a href="how-i-sell-hex/"><span class="num">01</span>How I'd Sell Hex in 2026</a></li>
        <li><a href="product-feedback/"><span class="num">02</span>My Product Feedback</a></li>
        <li><a href="won-deals/"><span class="num">03</span>My Won Deals as a Customer Lead</a></li>
        <li><a href="post-to-pre-sales/"><span class="num">04</span>Pre-Sales, Post-Sales, Always Selling</a></li>
      </ul>
    </nav>
  </header>
</main>
<script>
  // Ordered (Bayer) dither in Hex pink, denser toward the bottom of the hero.
  (function () {
    const c = document.querySelector('.dither');
    const B = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
    const PX = 6;
    function draw() {
      const w = Math.ceil(c.clientWidth / PX), h = Math.ceil(c.clientHeight / PX);
      if (!w || !h) return;
      c.width = w; c.height = h;
      const ctx = c.getContext('2d');
      const img = ctx.createImageData(w, h);
      for (let y = 0; y < h; y++) {
        const t = y / h;
        const band = Math.max(0, (t - 0.62) / 0.38);
        for (let x = 0; x < w; x++) {
          const dx = (x / w - 0.5) * 2;
          const wave = 0.08 * Math.sin(x / w * Math.PI * 3 + 1);
          const v = Math.pow(band, 1.6) * (1 - 0.35 * dx * dx) + (band > 0 ? wave * band : 0);
          if (v > (B[(y % 4) * 4 + (x % 4)] + 0.5) / 16) {
            const i = (y * w + x) * 4;
            img.data[i] = 245; img.data[i + 1] = 192; img.data[i + 2] = 192;
            img.data[i + 3] = 255 * (0.18 + 0.5 * band);
          }
        }
      }
      ctx.putImageData(img, 0, 0);
    }
    let t;
    new ResizeObserver(() => { clearTimeout(t); t = setTimeout(draw, 100); }).observe(c);
  })();
</script>
</body>
</html>
